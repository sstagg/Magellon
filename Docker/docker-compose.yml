      - DRAGONFLY_HOST=dragonfly
      - DRAGONFLY_PORT=6379
      - DRAGONFLY_PASSWORD=${DRAGONFLY_PASSWORD:-password}
      - MAGELLON_STEP_EVENTS_ENABLED=1
      - MAGELLON_STEP_EVENTS_RMQ=1
      - NATS_URL=nats://nats:4222
      - MAGELLON_PLUGIN_HTTP_ENDPOINT=http://magellon_can_classifier_plugin:80
    volumes:
      - ${MAGELLON_HOME_PATH}:/magellon
      - ${MAGELLON_GPFS_PATH}:/gpfs:ro  # research data: read-only, all writes go to MAGELLON_HOME_PATH/JOBS_PATH
      - ${MAGELLON_JOBS_PATH}:/jobs
    ports:
      - "127.0.0.1:${MAGELLON_CAN_CLASSIFIER_PLUGIN_PORT:-8041}:80"
    networks:
      magellon-network:
        ipv4_address: 172.16.238.27
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  magellon_template_picker_plugin:
    <<: *magellon-runtime-user
    build:
      context: ../plugins/magellon_template_picker_plugin
      dockerfile: Dockerfile
    image: magellon_template_picker_plugin_image
    container_name: magellon_template_picker_plugin_container
    restart: unless-stopped
    depends_on:
      - rabbitmq
