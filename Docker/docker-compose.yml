volumes:
  # Named volumes for all services
  rabbitmq-data: { }
  nats-data: { }
  postgres_data: { }
  grafana_storage: { }
  dragonfly-data: { }  # Added volume for Dragonfly
  app_data:  # Define a named volume for application data
  cache:
    driver: local
  caddy_data:
  caddy_config:

networks:
  # Internal network: web, backend, databases, broker and plugins talk to
  # each other here. Their host ports are bound to 127.0.0.1 only.
  magellon-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.16.238.0/24
  # Public-facing network: only the caddy proxy and the web frontend.
  magellon-public:
    driver: bridge
