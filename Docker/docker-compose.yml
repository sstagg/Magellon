      - RUN_ENV=docker
      - MAGELLON_LOG_DIR=/tmp/magellon-logs
      - MPLCONFIGDIR=/tmp/matplotlib
      - HOME=/tmp
      - GPFS_ROOT=${MAGELLON_GPFS_PATH}
      - JOBS_PATH=${MAGELLON_JOBS_PATH}
      - DRAGONFLY_HOST=dragonfly
      - DRAGONFLY_PORT=6379
      - DRAGONFLY_PASSWORD=${DRAGONFLY_PASSWORD:-password}
      - MAGELLON_STEP_EVENTS_ENABLED=1
      - MAGELLON_STEP_EVENTS_RMQ=1
      - NATS_URL=nats://nats:4222
      - MAGELLON_PLUGIN_HTTP_ENDPOINT=http://magellon_topaz_plugin:8000
    volumes:
      - ${MAGELLON_HOME_PATH}:/magellon
      - ${MAGELLON_GPFS_PATH}:/gpfs:ro  # research data: read-only, all writes go to MAGELLON_HOME_PATH/JOBS_PATH
      - ${MAGELLON_JOBS_PATH}:/jobs
    ports:
      - "127.0.0.1:${MAGELLON_TOPAZ_PLUGIN_PORT:-8039}:8000"
    networks:
      magellon-network:
        ipv4_address: 172.16.238.25

  magellon_stack_maker_plugin:
