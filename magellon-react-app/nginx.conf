server {
  listen 8080;
  sendfile on;
  default_type application/octet-stream;

  gzip on;
  gzip_http_version 1.1;
  gzip_disable      "MSIE [1-6]\.";
  gzip_min_length   256;
  gzip_vary         on;
  gzip_proxied      expired no-cache no-store private auth;
  gzip_types        text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;
  gzip_comp_level   9;

  root /usr/share/nginx/html;

  location = /config.js {
    alias /tmp/magellon-config.js;
    add_header Cache-Control "no-store";
  }

  # ── Static React app ─────────────────────────────────────────────────────────
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The page names the current build's bundle files, so browsers must check
  # for a new copy every time; otherwise a cached page keeps loading the
  # previous release's code after a deploy. Every SPA route lands here via
  # try_files above.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Bundle files carry a content hash in their name and never change, so
  # they can be cached for good.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # ── WebSocket (Socket.IO) ─────────────────────────────────────────────────────
  location /socket.io/ {
    proxy_pass         http://backend:8000/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_set_header   Host       $host;
    # Replace browser Origin with localhost so the backend's CORS check passes.
    # All traffic reaches the backend through this nginx proxy — the browser
    # has no direct path to port 8000, so spoofing origin here is safe.
    proxy_set_header   Origin     "http://127.0.0.1";
    proxy_set_header   X-Real-IP  $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
  }

  # ── WebSocket (Motioncor test & other backend WS endpoints) ──────────────────
  location ~ ^/web/ws/ {
    proxy_pass         http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_set_header   Host       $host;
    proxy_set_header   Origin     "http://127.0.0.1";
    proxy_set_header   X-Real-IP  $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
  }

  # ── Backend API paths ─────────────────────────────────────────────────────────
  # All non-static routes the CoreService registers (see main.py include_router calls),
  # plus the protected docs endpoints (main.py:204-260) — without these, requests fall
  # through to the SPA's index.html and the Swagger/ReDoc UI tries to parse HTML as a spec.
  location ~ ^/(health|db|export|image|web|graphs|io|pipelines|artifacts|auth|plugins|cancellation|admin|deployment|dispatch|particle-picking|system|graphql|docs|redoc|openapi\.json)(/|$) {
    proxy_pass         http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    client_max_body_size 5000m;
  }
}
